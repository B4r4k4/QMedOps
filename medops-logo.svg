<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" role="img" aria-labelledby="title desc">
  <title id="title">MedOps logo</title>
  <desc id="desc">A teal magnifying-glass symbol containing a cyan medical pulse line, with the words MedOps and Medical Compliance Simplified.</desc>

  <!-- Transparent background -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnifying-glass / Q symbol -->
    <path
      d="M574 438
         C574 324 483 232 369 232
         C249 232 153 329 153 449
         C153 569 249 666 369 666
         C398 666 426 660 451 650
         L510 708"
      stroke="#08717A"
      stroke-width="58" />

    <!-- Medical pulse -->
    <path
      d="M307 500
         H383
         L421 384
         L481 566
         L516 500
         H639"
      stroke="#20BBC5"
      stroke-width="29" />
  </g>

  <!-- Brand name -->
  <text
    x="400"
    y="825"
    fill="#24B8C4"
    font-family="Arial, Helvetica, sans-serif"
    font-size="116"
    font-weight="800"
    letter-spacing="-5"
    text-anchor="middle">MedOps</text>

  <!-- Tagline -->
  <text
    x="400"
    y="906"
    fill="#08717A"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="0.3"
    text-anchor="middle">Medical Compliance Simplified</text>
</svg>
